[project]
name = "talos"
version = "0.1.0"
description = "Talos — primary orchestrator: routes, delegates, parallelizes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "othrys",
    "atlas",
    "iapetus",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talos"]

[project.scripts]
talos = "talos.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
