name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  engine:
    name: Engine (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest --run

  python-titans:
    name: Python Titans (${{ matrix.titan }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        titan: [kronos, atlas, coeus, iapetus, talos]
    defaults:
      run:
        working-directory: ${{ matrix.titan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install othrys
        run: pip install -e ../othrys
      - name: Install Titan
        run: pip install -e ".[dev]"
      - name: Type check
        run: mypy src
      - name: Run tests
        run: pytest -q
