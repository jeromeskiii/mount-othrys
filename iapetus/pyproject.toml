[project]
name = "iapetus"
version = "0.1.0"
description = "Iapetus — deep execution orchestrator with thinking-mode subagents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "othrys",
    "atlas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iapetus"]

[project.scripts]
iapetus = "iapetus.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No ``addopts`` here: a repo-level ``-q`` stacks with a CLI ``-q`` into
# ``-qq``, which suppresses pytest's final "N passed" summary line. Pass
# ``-q`` on the command line when quiet output is wanted.
