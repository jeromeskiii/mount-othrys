[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coeus"
version = "0.1.0"
description = "Coeus — Strategic Planning Consultant CLI. Interview-first planning with Metis review and Momus validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "othrys",
]

[project.optional-dependencies]
# mypy must be here: CI's typecheck step runs `mypy src` after
# `pip install -e ".[dev]"`, and a dev extra without mypy makes that step fail
# with `command not found` instead of a type error. types-PyYAML covers the yaml
# import in coeus/state.py.
dev = ["pytest>=8.0", "mypy", "types-PyYAML"]

[project.scripts]
coeus = "coeus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No ``addopts`` here: a repo-level ``-q`` stacks with a CLI ``-q`` into
# ``-qq``, which suppresses pytest's final "N passed" summary line. Pass
# ``-q`` on the command line when quiet output is wanted.
