[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — sequential orchestrator for Coeus plans (Kronos Titan system)"
requires-python = ">=3.11"
dependencies = [
    "othrys",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]
