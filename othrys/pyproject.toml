[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "othrys"
version = "0.1.0"
description = "Shared Mount Othrys core library — config, LLM client, tools, CLI helpers"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.97",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/othrys"]
